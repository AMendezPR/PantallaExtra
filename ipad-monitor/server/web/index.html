<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PantallaExtra">
<title>PantallaExtra</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #screen { position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #ccc; font: 17px -apple-system, system-ui, sans-serif;
    pointer-events: none; text-align: center; padding: 20px; }
  #menu { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; opacity: .55; }
  #menu button { width: 44px; height: 44px; border-radius: 22px; border: 0;
    background: rgba(40,40,40,.85); color: #fff; font-size: 20px; }
  #kbd { position: fixed; left: -1000px; top: 0; opacity: 0; }
</style>
</head>
<body>
<img id="screen" alt="">
<div id="status">Conectando…</div>
<div id="menu">
  <button id="btnKbd" title="Teclado">⌨︎</button>
  <button id="btnFull" title="Pantalla completa">⤢</button>
</div>
<input id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
<script>
"use strict";
const img = document.getElementById("screen");
const statusEl = document.getElementById("status");
let ws = null, lastUrl = null, decoding = false, pendingBlob = null;

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "blob";
  ws.onopen = () => { statusEl.textContent = ""; };
  ws.onmessage = (e) => {
    if (typeof e.data === "string") return;  // hello
    pendingBlob = e.data; show();
  };
  ws.onclose = () => {
    statusEl.textContent = "Sin conexión con el computador. Reintentando…";
    setTimeout(connect, 1500);
  };
}
// Muestra solo el frame más reciente (si llegan varios mientras decodifica, salta).
function show() {
  if (decoding || !pendingBlob) return;
  const blob = pendingBlob; pendingBlob = null; decoding = true;
  const url = URL.createObjectURL(blob);
  img.onload = () => { if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = url; decoding = false; show(); };
  img.onerror = () => { URL.revokeObjectURL(url); decoding = false; show(); };
  img.src = url;
}
function send(ev) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(ev)); }

// Coordenadas normalizadas 0..1 dentro de la imagen (object-fit: contain).
function norm(clientX, clientY) {
  const r = img.getBoundingClientRect();
  const iw = img.naturalWidth || 16, ih = img.naturalHeight || 9;
  const s = Math.min(r.width / iw, r.height / ih);
  const w = iw * s, h = ih * s, ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
  return { x: Math.min(1, Math.max(0, (clientX - ox) / w)),
           y: Math.min(1, Math.max(0, (clientY - oy) / h)) };
}

// ---- Gestos: 1 dedo = clic / arrastrar, mantener = clic derecho,
//              2 dedos = desplazar, toque con 2 dedos = clic derecho
const pts = new Map();
let mode = null, start = null, longTimer = null, twoStart = 0, twoMoved = false,
    lastMid = null, accX = 0, accY = 0, lastMoveSent = 0;
const DRAG_PX = 8, SCROLL_STEP = 18;

function mid() {
  let x = 0, y = 0; for (const p of pts.values()) { x += p.x; y += p.y; }
  return { x: x / pts.size, y: y / pts.size };
}
img.addEventListener("pointerdown", (e) => {
  e.preventDefault(); img.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) {
    mode = "pending"; start = { x: e.clientX, y: e.clientY };
    clearTimeout(longTimer);
    longTimer = setTimeout(() => {
      if (mode === "pending") { mode = "done"; send({ t: "rclick", ...norm(start.x, start.y) }); }
    }, 600);
  } else if (pts.size === 2) {
    clearTimeout(longTimer);
    if (mode === "drag") send({ t: "up", ...norm(e.clientX, e.clientY) });
    mode = "two"; twoStart = performance.now(); twoMoved = false;
    lastMid = mid(); accX = accY = 0;
  }
});
img.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === "pending" && Math.hypot(e.clientX - start.x, e.clientY - start.y) > DRAG_PX) {
    clearTimeout(longTimer); mode = "drag";
    send({ t: "down", ...norm(start.x, start.y) });
  }
  if (mode === "drag") {
    const now = performance.now();
    if (now - lastMoveSent > 8) { lastMoveSent = now; send({ t: "move", ...norm(e.clientX, e.clientY) }); }
  } else if (mode === "two" && pts.size >= 2) {
    const m = mid(); accX += m.x - lastMid.x; accY += m.y - lastMid.y; lastMid = m;
    if (Math.abs(accX) > 6 || Math.abs(accY) > 6) twoMoved = true;
    const dy = Math.trunc(accY / SCROLL_STEP), dx = Math.trunc(-accX / SCROLL_STEP);
    if (dx || dy) { send({ t: "scroll", dx, dy }); accX -= -dx * SCROLL_STEP; accY -= dy * SCROLL_STEP; }
  }
});
function end(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (mode === "pending") { clearTimeout(longTimer); send({ t: "click", ...norm(start.x, start.y) }); mode = "done"; }
  else if (mode === "drag") { send({ t: "up", ...norm(e.clientX, e.clientY) }); mode = "done"; }
  else if (mode === "two" && pts.size === 0) {
    if (!twoMoved && performance.now() - twoStart < 350) send({ t: "rclick", ...norm(lastMid.x, lastMid.y) });
    mode = "done";
  }
  if (pts.size === 0) mode = null;
}
img.addEventListener("pointerup", end);
img.addEventListener("pointercancel", end);
img.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ---- Teclado en pantalla
const kbd = document.getElementById("kbd");
document.getElementById("btnKbd").onclick = () => { kbd.value = " "; kbd.focus(); };
kbd.addEventListener("input", () => {
  const v = kbd.value;
  if (v.length > 1) send({ t: "text", s: v.slice(1) });
  else if (v.length === 0) send({ t: "key", k: "backspace" });
  kbd.value = " ";
});
kbd.addEventListener("keydown", (e) => {
  const map = { Enter: "enter", Tab: "tab", Escape: "esc", ArrowLeft: "left",
                ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
  if (map[e.key]) { e.preventDefault(); send({ t: "key", k: map[e.key] }); }
});
document.getElementById("btnFull").onclick = () => {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
};

connect();
</script>
</body>
</html>
